# ローカル実行用（Phase 1 MVP は自分だけが使う前提）。
#   cp .env.example .env   # 初回だけ。値を変えなければ無くても起動する
#   docker compose up --build -d
#   curl localhost:18080/actuator/health
# ホスト側は api 18080 / postgres 15432。8080 / 5432 は ./gradlew bootRun や他プロジェクト用に空けておく
services:
  postgres:
    # Testcontainers（TestcontainersConfiguration）と同じメジャーバージョンに揃える
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-coach}
      POSTGRES_USER: ${DB_USERNAME:-coach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coach}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      # postgres 18 以降のイメージはデータを /var/lib/postgresql/<major>/ に置くので、親ディレクトリをマウントする
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-coach}
      DB_USERNAME: ${DB_USERNAME:-coach}
      DB_PASSWORD: ${DB_PASSWORD:-coach}
    ports:
      - "${API_PORT:-18080}:8080"
    healthcheck:
      # JRE イメージには curl が無いので bash の /dev/tcp で疎通だけ見る
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
